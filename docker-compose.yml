services:
  postgres:
    image: postgres:17
    container_name: base-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: base_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d base_app"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./src/api/Base.Api
      dockerfile: Dockerfile.dev
    container_name: base-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5000
      ConnectionStrings__AppDb: Host=postgres;Port=5432;Database=base_app;Username=postgres;Password=postgres
    ports:
      - "5000:5000"
    volumes:
      - ./src/api/Base.Api:/src
      - api_bin:/src/bin
      - api_obj:/src/obj

  web:
    build:
      context: ./src/web
      dockerfile: Dockerfile.dev
    container_name: base-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      VITE_API_URL: http://localhost:5000
    ports:
      - "5173:5173"
    volumes:
      - ./src/web:/app
      - web_node_modules:/app/node_modules

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: base-prometheus
    restart: unless-stopped
    depends_on:
      - api
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:11.4.0
    container_name: base-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3001:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  api_bin:
  api_obj:
  web_node_modules:
