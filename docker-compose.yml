services:
  postgres:
    image: postgres:17
    container_name: base-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: base_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d base_app"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
